  <div class="top"><div class="logo"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="34" height="34" aria-hidden="true"><rect width="120" height="120" rx="28" fill="#0f766e"/><g fill="#fff"><rect x="30" y="28" width="12" height="64" rx="6"/><rect x="30" y="28" width="48" height="12" rx="6"/><rect x="30" y="54" width="38" height="12" rx="6"/><rect x="30" y="80" width="48" height="12" rx="6"/></g><circle cx="84" cy="84" r="20" fill="#c28a1b" stroke="#0f766e" stroke-width="5"/><path d="M74 84l7 7 13-14" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Easy <span class="pay">Pay</span></span></div><span class="mode" id="mode" role="button" tabindex="0" title="اضغط للمزامنة"></span></div>

<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Math.round(+n||0).toLocaleString('en-US');
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>isoOf(new Date());
const addMonths=(iso,n)=>{const d=new Date(iso+'T00:00:00');const day=d.getDate();d.setMonth(d.getMonth()+n);if(d.getDate()!==day)d.setDate(0);return isoOf(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const fdate=iso=>{if(!iso)return'';const[y,m,d]=iso.split('-');return d+'/'+m+'/'+y};
const MONTHS=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

/* ---------- الحسابات ---------- */
function calcContract(price,down,rate,months){
  const profit=Math.round((+price||0)*(+rate||0)/100);
  const total=(+price||0)+profit;
  const financed=Math.max(0,total-(+down||0));
  const m=Math.max(1,+months||1);
  const per=Math.ceil(financed/m);
  return{financed,profit,total,per,months:m};
}
function buildInst(total,months,start){
  const m=Math.max(1,months),per=Math.ceil(total/m);let left=total;const out=[];
  for(let i=0;i<m;i++){const amt=i===m-1?left:Math.min(per,left);left-=amt;out.push({n:i+1,due:addMonths(start,i+1),amount:amt,paid:0,paidDate:''})}
  return out;
}
const kPaid=k=>k.inst.reduce((s,i)=>s+i.paid,0);
const kInstTotal=k=>k.inst.reduce((s,i)=>s+i.amount,0);
const kRemain=k=>Math.max(0,kInstTotal(k)-kPaid(k));
const kCollected=k=>kPaid(k)+(k.v===2?(+k.down||0):0);
const kProfitReal=k=>k.total>0?Math.min(k.profit,k.profit*kCollected(k)/k.total):0;
const kLate=k=>{const t=today();return k.inst.filter(i=>i.paid<i.amount&&i.due<t)};
const kLateAmt=k=>kLate(k).reduce((s,i)=>s+i.amount-i.paid,0);
function applyPayment(k,amount,date,only){
  let left=+amount;if(!(left>0))return 0;let used=0;
  const list=only!=null?[k.inst[only]]:k.inst;
  for(const i of list){if(left<=0)break;const need=i.amount-i.paid;if(need<=0)continue;const x=Math.min(need,left);i.paid+=x;left-=x;used+=x;i.paidDate=date}
  if(used>0){k.pays=k.pays||[];k.pays.push({date,amount:used})}
  return used;
}
function partnerStats(p,contracts){
  const ks=contracts.filter(k=>k.partnerId===p.id);
  const out={n:ks.length,out:0,collected:0,remain:0,profit:0,real:0,late:0};
  for(const k of ks){out.out+=(k.v===2?k.price:k.financed);out.collected+=kCollected(k);out.remain+=kRemain(k);out.profit+=k.profit;out.real+=kProfitReal(k);out.late+=kLateAmt(k)}
  out.company=out.real*(p.companyPct||0)/100;
  out.net=out.real-out.company;
  out.companyTotal=out.profit*(p.companyPct||0)/100;
  return out;
}

/* ---------- التخزين ---------- */
const S={partners:[],customers:[],contracts:[],settings:[],expenses:[],withdrawals:[]};
const COLS=Object.keys(S);
let DB=null,MODE='local',SYNCING=false,RETRY_SYNC=false,CONNECTING=false,SUBSCRIBED=false;
const CLOUD_SNAP={};
let PRE_CLOUD_LOCAL=null,MIG_SEEN=null,LAST_TS=0,TOAST_TMR=null;
const LS='taqseet_v1';
const QK='taqseet_queue_v1';
const MIG_K='taqseet_migrated_v1';
const HAD_CLOUD_K='taqseet_had_cloud_v1';
const hasCloudEnv=()=>!!(window.claude&&typeof window.claude.use==='function');
const cloudExpected=()=>{try{return hasCloudEnv()||localStorage.getItem(HAD_CLOUD_K)==='1'}catch(e){return hasCloudEnv()}};
function loadLocal(){try{const j=JSON.parse(localStorage.getItem(LS)||'null');if(j)COLS.forEach(c=>S[c]=Array.isArray(j[c])?j[c]:[])}catch(e){}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
function loadQueue(){try{const q=JSON.parse(localStorage.getItem(QK)||'[]');return Array.isArray(q)?q:[]}catch(e){return[]}}
function saveQueue(q){try{localStorage.setItem(QK,JSON.stringify(q))}catch(e){}}
function enqueueOp(col,id,type,data){
  const q=loadQueue().filter(x=>!(x.col===col&&x.id===id));
  const now=Date.now();LAST_TS=now>LAST_TS?now:LAST_TS+1;
  q.push({col,id,type,data:type==='set'?JSON.parse(JSON.stringify(data)):null,ts:LAST_TS});
  saveQueue(q);
}
function applyQueueToList(col,base){
  const map=new Map();
  (base||[]).forEach(x=>{if(x&&x.id)map.set(x.id,JSON.parse(JSON.stringify(x)))});
  loadQueue().forEach(op=>{
    if(op.col!==col)return;
    if(op.type==='set'&&op.data)map.set(op.id,JSON.parse(JSON.stringify(op.data)));
    else if(op.type==='del')map.delete(op.id);
  });
  return Array.from(map.values());
}
function showToast(msg){
  const el=$('#toast');if(!el)return;
  el.textContent=msg;el.style.display='block';
  clearTimeout(TOAST_TMR);
  TOAST_TMR=setTimeout(()=>{el.style.display='none'},3200);
}
function updateModeBadge(){
  const m=$('#mode');if(!m)return;
  const q=loadQueue();
  if(!cloudExpected()&&!DB){m.textContent='💾 على هذا الجهاز';return}
  if(SYNCING||CONNECTING){m.textContent='🔄 جارٍ المزامنة';return}
  const on=navigator.onLine!==false;
  if(DB&&on&&q.length===0){m.textContent='☁ متزامن';return}
  if(q.length>0){
    m.textContent=(!on||!DB)?`⚠ غير متصل - ${q.length} تغيير بانتظار الرفع`:`⚠ ${q.length} تغيير بانتظار الرفع`;
    return;
  }
  m.textContent='⚠ غير متصل';
}
function parseSnap(snap){
  const arr=snap&&snap.docs?snap.docs:Array.isArray(snap)?snap:[];
  return arr.map(d=>{const data=typeof d.data==='function'?d.data():(d.data||d);return{...data,id:data.id||d.id}}).filter(x=>x&&x.id);
}
function put(col,obj){
  const clean=JSON.parse(JSON.stringify(obj));
  const i=S[col].findIndex(x=>x.id===clean.id);
  if(i>=0)S[col][i]=clean;else S[col].push(clean);
  saveLocal();
  if(DB||cloudExpected()){
    enqueueOp(col,clean.id,'set',clean);
    updateModeBadge();render();
    if(DB&&navigator.onLine!==false)flushQueue();
    else if(!DB&&hasCloudEnv()&&navigator.onLine!==false)connectCloud();
  }else{updateModeBadge();render()}
}
function del(col,id){
  S[col]=S[col].filter(x=>x.id!==id);
  saveLocal();
  if(DB||cloudExpected()){
    enqueueOp(col,id,'del',null);
    updateModeBadge();render();
    if(DB&&navigator.onLine!==false)flushQueue();
    else if(!DB&&hasCloudEnv()&&navigator.onLine!==false)connectCloud();
  }else{updateModeBadge();render()}
}
async function flushQueue(){
  if(SYNCING){RETRY_SYNC=true;return 0}
  if(!DB){
    if(hasCloudEnv()&&navigator.onLine!==false)await connectCloud();
    if(!DB){updateModeBadge();return 0}
  }
  if(navigator.onLine===false){updateModeBadge();return 0}
  if(!loadQueue().length){updateModeBadge();return 0}
  SYNCING=true;updateModeBadge();
  let synced=0,failed=false;
  try{
    while(true){
      const snap=loadQueue();
      if(!snap.length||navigator.onLine===false)break;
      let progressed=false;
      for(const op of snap){
        if(navigator.onLine===false){failed=true;break}
        try{
          if(op.type==='set')await DB.collection(op.col).doc(op.id).set(JSON.parse(JSON.stringify(op.data)));
          else await DB.collection(op.col).doc(op.id).delete();
          const cur=loadQueue();
          saveQueue(cur.filter(x=>!(x.col===op.col&&x.id===op.id&&x.ts===op.ts)));
          synced++;progressed=true;
        }catch(e){console.error(e);failed=true;break}
      }
      if(failed||!progressed)break;
    }
  }finally{SYNCING=false;updateModeBadge()}
  if(synced>0)showToast(`تمت مزامنة ${synced} تغيير`);
  if(RETRY_SYNC&&!failed){RETRY_SYNC=false;setTimeout(()=>flushQueue(),0)}
  return synced;
}
function subscribeSnapshots(){
  if(!DB||SUBSCRIBED)return;
  SUBSCRIBED=true;
  COLS.forEach(col=>{
    DB.collection(col).onSnapshot(s=>{
      const cloudItems=parseSnap(s);
      CLOUD_SNAP[col]=cloudItems;
      if(localStorage.getItem(MIG_K)!=='1'&&PRE_CLOUD_LOCAL&&MIG_SEEN&&!MIG_SEEN.has(col)){
        MIG_SEEN.add(col);
        const cloudIds=new Set(cloudItems.map(x=>x.id));
        const qDel=new Set(loadQueue().filter(x=>x.col===col&&x.type==='del').map(x=>x.id));
        let added=0;
        for(const rec of (PRE_CLOUD_LOCAL[col]||[])){
          if(rec&&rec.id&&!cloudIds.has(rec.id)&&!qDel.has(rec.id)){enqueueOp(col,rec.id,'set',rec);added++}
        }
        if(MIG_SEEN.size===COLS.length){try{localStorage.setItem(MIG_K,'1')}catch(e){}PRE_CLOUD_LOCAL=null}
        if(added>0)setTimeout(()=>flushQueue(),0);
      }
      S[col]=applyQueueToList(col,cloudItems);
      saveLocal();updateModeBadge();render();
    },e=>{console.error(e);updateModeBadge()});
  });
}
async function connectCloud(){
  if(DB||CONNECTING||!hasCloudEnv()||navigator.onLine===false)return false;
  CONNECTING=true;updateModeBadge();
  try{
    const c=await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),4000))]);
    if(!c){CONNECTING=false;updateModeBadge();return false}
    if(localStorage.getItem(MIG_K)!=='1'&&!PRE_CLOUD_LOCAL){
      PRE_CLOUD_LOCAL={};COLS.forEach(col=>PRE_CLOUD_LOCAL[col]=JSON.parse(JSON.stringify(S[col]||[])));
      MIG_SEEN=new Set();
    }
    DB=c;MODE='cloud';
    try{localStorage.setItem(HAD_CLOUD_K,'1')}catch(e){}
    CONNECTING=false;
    await flushQueue();
    subscribeSnapshots();
    updateModeBadge();
    return true;
  }catch(e){console.error(e);CONNECTING=false;updateModeBadge();return false}
}
async function initStore(){
  loadLocal();
  COLS.forEach(c=>S[c]=applyQueueToList(c,S[c]));
  updateModeBadge();render();
  if(hasCloudEnv())await connectCloud();
  window.addEventListener('online',()=>{if(cloudExpected()){if(!DB)connectCloud();else flushQueue()}updateModeBadge()});
  window.addEventListener('offline',()=>updateModeBadge());
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&cloudExpected()){if(!DB)connectCloud();else flushQueue()}});
  setInterval(()=>{if(!cloudExpected()||navigator.onLine===false)return;if(!DB)connectCloud();else if(loadQueue().length)flushQueue()},30000);
}

/* ---------- الحالة والتنقل ---------- */
const st={tab:'home',sel:null,pf:'',q:''};
const TABS=[['home','🏠','الرئيسية'],['contracts','📄','العقود'],['customers','👥','العملاء'],['partners','🤝','الشركاء'],['reports','📊','التقارير']];
function go(tab,sel=null){st.tab=tab;st.sel=sel;st.q='';render();window.scrollTo(0,0)}
const pName=id=>(S.partners.find(p=>p.id===id)||{name:'—'}).name;
const cust=id=>S.customers.find(c=>c.id===id)||{name:'—'};
const visK=()=>S.contracts.filter(k=>!st.pf||k.partnerId===st.pf);
const visC=()=>S.customers.filter(c=>!st.pf||c.partnerId===st.pf);

/* ---------- العرض ---------- */
function late(k){const l=kLate(k);return l.length?Math.max(...l.map(i=>daysBetween(i.due,today()))):0}
function waLink(phone,text){
  let p=String(phone||'').replace(/\D/g,'');if(!p)return'';
  if(p.startsWith('0'))p='2'+p;else if(!p.startsWith('20'))p='20'+p;
  return`https://wa.me/${p}?text=${encodeURIComponent(text)}`;
}
function remNumbers(){const d=S.settings.find(x=>x.id==='main');return(d&&d.numbers)||[]}
function weekMsg(){
  const t=today(),soon=[],lt=[];
  S.contracts.forEach(k=>k.inst.forEach(i=>{if(i.paid>=i.amount)return;const r=i.amount-i.paid;
    if(i.due<t)lt.push({k,i,r});else if(daysBetween(t,i.due)<=7)soon.push({k,i,r})}));
  soon.sort((a,b)=>a.i.due.localeCompare(b.i.due));
  const line=x=>`• ${cust(x.k.customerId).name} (${pName(x.k.partnerId)}) - ${fmt(x.r)} ج - ${fdate(x.i.due)}`;
  let m=`📌 تذكير الأقساط - ${fdate(t)}\n\n`;
  m+=`أقساط خلال 7 أيام (${soon.length}) - ${fmt(soon.reduce((s,x)=>s+x.r,0))} ج:\n`+(soon.slice(0,20).map(line).join('\n')||'لا يوجد')+(soon.length>20?`\n... و${soon.length-20} أخرى`:'');
  if(lt.length){m+=`\n\n⚠ متأخر (${lt.length}) - ${fmt(lt.reduce((s,x)=>s+x.r,0))} ج:\n`+lt.slice(0,15).map(line).join('\n')+(lt.length>15?`\n... و${lt.length-15} أخرى`:'')}
  return{msg:m,n:soon.length,late:lt.length};
}
function lateMsg(c,k){
  return`السلام عليكم ${c.name}، نفكّرك بقسط متأخر ${fmt(kLateAmt(k))} جنيه على عقد ${k.item}. برجاء السداد في أقرب وقت. شكراً.`;
}

const TG_K='taqseet_tg_v1';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function tgLoad(){try{return JSON.parse(localStorage.getItem(TG_K)||'{}')||{}}catch(e){return{}}}
function tgSave(o){try{localStorage.setItem(TG_K,JSON.stringify(o))}catch(e){}}

async function copyText(txt,btn){
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(txt);ok=true}}catch(e){}
  if(!ok){try{const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ok=document.execCommand('copy');ta.remove()}catch(e){}}
  if(ok){if(btn){const old=btn.textContent;btn.textContent='تم النسخ ✓';setTimeout(()=>btn.textContent=old,1500)}else showToast('تم النسخ ✓')}
  else showToast('تعذر النسخ تلقائياً');
}
async function tgApi(method,params,tokOv){
  const tok=(tokOv!=null?tokOv:tgToken()).trim();
  if(!tok)return{ok:false,kind:'notoken',msg:'أدخل Bot Token أولاً من إعدادات تيليجرام.'};
  const url=`https://api.telegram.org/bot${encodeURIComponent(tok)}/${method}`;
  try{
    const opts=params?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(params)}:{method:'GET'};
    const res=await fetch(url,opts);
    let j=null;try{j=await res.json()}catch(e){}
    if(res.ok&&j&&j.ok)return{ok:true,result:j.result};
    const code=(j&&j.error_code)||res.status;
    const desc=(j&&j.description)||'';
    if(code===403)return{ok:false,code:403,kind:'blocked',msg:'العميل أوقف البوت أو حظره (403). لازم يضغط Start على البوت من تاني.'};
    if(code===429){const ra=(j&&j.parameters&&j.parameters.retry_after)||5;return{ok:false,code:429,kind:'ratelimit',retryAfter:ra,msg:`تم تجاوز حد الإرسال (429). انتظر ${ra} ثانية وحاول مرة أخرى.`}}
    if(code===409&&method==='getUpdates')return{ok:false,code:409,kind:'webhook',msg:'البوت عليه Webhook مفعّل (409) ولا يعمل مع getUpdates. يُنصح بإنشاء بوت جديد مخصص للتقسيط.'};
    if(code===401||code===404)return{ok:false,code,kind:'auth',msg:'Bot Token غير صحيح. راجع التوكن في إعدادات تيليجرام.'};
    return{ok:false,code,kind:'api',msg:`فشل طلب تيليجرام (${code})${desc?': '+desc:''}`};
  }catch(e){
    return{ok:false,kind:'network',msg:'تعذر الاتصال بـ api.telegram.org. تحقق من الإنترنت أو من أن بيئة النشر لا تمنع الاتصال الخارجي.'};
  }
}
async function tgSend(chatId,text,onWait){
  let r=await tgApi('sendMessage',{chat_id:String(chatId),text:String(text)});
  if(!r.ok&&r.code===429){
    const sec=Math.min(60,Math.max(1,+r.retryAfter||5));
    if(onWait)onWait(sec);
    await sleep(sec*1000);
    r=await tgApi('sendMessage',{chat_id:String(chatId),text:String(text)});
  }
  return r;
}

async function syncCustomersTg(){
  if(!tgToken()){tgSettingsModal();return}
  modal('<h2>تحديث ربط العملاء</h2><p class="mut">جارٍ قراءة تحديثات البوت...</p>');
  const r=await tgApi('getUpdates');
  if(!r.ok){tgErrModal('تحديث ربط تيليجرام',r);return}
  let linked=0;
  const seen=new Map();
  (r.result||[]).forEach(up=>{
    const msg=up.message;
    if(!msg||typeof msg.text!=='string'||!msg.chat||msg.chat.id==null)return;
    const m=msg.text.trim().match(/^\/start(?:@\S+)?\s+c_([^\s]+)/i);
    if(m)seen.set(m[1],String(msg.chat.id));
  });
  seen.forEach((chatId,cid)=>{
    const c=S.customers.find(x=>x.id===cid);
    if(c&&String(c.tgChatId||'')!==chatId){
      put('customers',{...c,tgChatId:chatId});
      linked++;
    }
  });
  modal(`<h2>تحديث الربط<button class="btn sm gh" type="button" id="x">✕</button></h2>
  <p>${linked>0?`تم ربط <b>${linked}</b> عميل بنجاح.`:'لم يتم العثور على عمليات ربط جديدة. تأكد أن العميل فتح رابط الربط وضغط Start في البوت.'}</p>
  <button class="btn" style="width:100%" id="ok">حسناً</button>`);
  $('#x').onclick=closeModal;$('#ok').onclick=closeModal;
}
function sendLateOneTg(kid){
  const k=S.contracts.find(x=>x.id===kid);if(!k)return;
  const c=cust(k.customerId);if(!c.tgChatId)return;
  const msg=lateMsg(c,k);
  const run=async()=>{
    modal(`<h2>إرسال عبر تيليجرام</h2><p id="tgprog" class="mut">جارٍ الإرسال إلى ${esc(c.name)}...</p>`);
    const r=await tgSend(c.tgChatId,msg,sec=>{const p=$('#tgprog');if(p)p.textContent=`تم تجاوز الحد (429)، الانتظار ${sec} ثانية ثم إعادة المحاولة...`});
    if(r.ok){
      put('customers',{...c,tgLast:today()});
      closeModal();showToast('تم إرسال التذكير لـ '+c.name);
    }else{
      tgErrModal('تعذر الإرسال لـ '+c.name,r,msg);
    }
  };

    confirmModal(`تم إرسال تذكير لـ <b>${esc(c.name)}</b> اليوم بالفعل (${fdate(c.tgLast)}). هل تريد الإرسال مرة أخرى؟`,run);
  }else run();
}

    $('#stopb').onclick=()=>{stop=true;$('#stopb').disabled=true;$('#stopb').textContent='جارٍ الإيقاف...'};
    let okN=0,failN=0,netCopy=[];

  <div class="row" style="gap:8px;margin-bottom:10px"><button class="btn sm" style="flex:1" data-addmov="expenses:${p.id}">+ مصروف</button><button class="btn sm gh" style="flex:1" data-addmov="withdrawals:${p.id}">+ سحب</button></div>
  ${movs.length?movs.map(m=>`<div class="card"><div class="row"><div><span class="tag ${m._cls}">${m._lbl}</span> <span class="mut">${fdate(m.date)}</span>${m.note?`<div style="margin-top:4px">${esc(m.note)}</div>`:''}</div><b dir="ltr">${fmt(m.amount)}</b></div>
  <div class="row" style="margin-top:8px;justify-content:flex-end;gap:6px"><button class="btn sm gh" data-editmov="${m._col}:${m.id}">تعديل</button><button class="btn sm red" data-delmov="${m._col}:${m.id}">حذف</button></div></div>`).join(''):'<div class="card empty">لا توجد مصروفات أو سحوبات</div>'}
  <h3>عملاء الشريك (${cs.length})</h3>${cs.map(c=>`<div class="card item row" data-cust="${c.id}"><div class="nm">${esc(c.name)}</div><span class="mut">${esc(c.phone||'')}</span></div>`).join('')||'<div class="empty">لا يوجد عملاء</div>'}`;
}
function vReports(){
  const ps=visP();let T={out:0,collected:0,remain:0,profit:0,real:0,company:0,net:0,late:0};
  const rows=ps.map(p=>{const s=partnerStats(p,S.contracts);for(const k in T)T[k]+=s[k]||0;return`<tr><td><b>${esc(p.name)}</b></td><td>${fmt(s.collected)}</td><td>${fmt(s.remain)}</td><td>${fmt(s.real)}</td><td>${p.companyPct||0}%</td><td style="color:var(--gold)"><b>${fmt(s.company)}</b></td><td style="color:var(--grn)"><b>${fmt(s.net)}</b></td></tr>`}).join('');
  const now=new Date();const ms=[];for(let i=5;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);ms.push({key:d.getFullYear()+'-'+pad(d.getMonth()+1),label:MONTHS[d.getMonth()],v:0})}
  visK().forEach(k=>(k.pays||[]).forEach(p=>{const m=ms.find(x=>x.key===p.date.slice(0,7));if(m)m.v+=p.amount}));
  const mx=Math.max(1,...ms.map(m=>m.v));
  return`<h2>التقارير ${st.pf?`<span class="mut">${esc(pName(st.pf))}</span>`:''}</h2>
  <div class="grid"><div class="kpi"><small>إجمالي المحصّل</small><strong>${fmt(T.collected)}</strong></div><div class="kpi"><small>المتبقي</small><strong>${fmt(T.remain)}</strong></div>
  <div class="kpi"><small>الأرباح المحققة</small><strong>${fmt(T.real)}</strong></div><div class="kpi red"><small>متأخر</small><strong>${fmt(T.late)}</strong></div>
  <div class="kpi" style="border-color:var(--gold)"><small>نصيب الشركة</small><strong style="color:var(--gold)">${fmt(T.company)}</strong></div><div class="kpi grn"><small>صافي أرباح الشركاء</small><strong>${fmt(T.net)}</strong></div></div>
  <h3>التحصيل آخر 6 شهور</h3><div class="card"><div class="bars">${ms.map(m=>`<div><span style="height:${Math.round(m.v/mx*90)}px"></span>${m.label}<br><b style="color:var(--ink)">${fmt(m.v)}</b></div>`).join('')}</div></div>
  <h3>حساب الشركاء ونسبة الشركة</h3><div class="card tw"><table><tr><th>الشريك</th><th>محصّل</th><th>متبقي</th><th>ربح محقق</th><th>النسبة</th><th>للشركة</th><th>للشريك</th></tr>${rows||'<tr><td colspan="7" class="empty">لا توجد بيانات</td></tr>'}
  ${ps.length>1?`<tr><td><b>الإجمالي</b></td><td><b>${fmt(T.collected)}</b></td><td><b>${fmt(T.remain)}</b></td><td><b>${fmt(T.real)}</b></td><td></td><td><b>${fmt(T.company)}</b></td><td><b>${fmt(T.net)}</b></td></tr>`:''}</table></div>
  <p class="mut">الربح المحقق = ربح العقد × (المحصّل ÷ إجمالي العقد). نصيب الشركة = الربح المحقق × نسبة الشركة المحددة لكل شريك.</p>`;
}

/* ---------- النماذج ---------- */
function modal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on');$('#sheet').innerHTML=''}
function formModal(title,body,label,cb,onready){
  modal(`<h2>${title}<button class="btn sm gh" type="button" id="x">✕</button></h2><form id="f">${body}<div class="row" style="margin-top:8px"><button class="btn" style="flex:1" type="submit">${label}</button></div></form>`);
  $('#x').onclick=closeModal;
  $('#f').onsubmit=e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target).entries());if(cb(o)!==false)closeModal()};
  onready&&onready();
}
function confirmModal(msg,yes){
  modal(`<h2>تأكيد</h2><p>${msg}</p><div class="row" style="gap:8px"><button class="btn red" style="flex:1" id="y">نعم، متأكد</button><button class="btn gh" style="flex:1" id="n">إلغاء</button></div>`);
  $('#n').onclick=closeModal;$('#y').onclick=()=>{closeModal();yes()};
}
const F=(l,n,v='',t='text',x='')=>`<div class="fld"><label>${l}</label><input name="${n}" type="${t}" value="${esc(v)}" ${x}></div>`;

function partnerForm(p){
  p=p||{};
  formModal(p.id?'تعديل شريك':'شريك جديد',
   F('اسم الشريك','name',p.name,'text','required')+F('التليفون','phone',p.phone,'tel')+
   `<div class="two">${F('رأس المال (جنيه)','capital',p.capital??'','number','min="0" step="any"')}${F('ربح التقسيط الافتراضي %','rate',p.rate??'','number','min="0" step="any" required')}</div>`+
   F('نسبة الشركة من أرباح الشريك %','companyPct',p.companyPct??'','number','min="0" max="100" step="any" required')+
   `<p class="mut">مثال: لو الشريك ربحه 20% على العقد، والشركة بتاخد 30% من الربح ده، اكتب 20 في الأولى و30 في التانية.</p>`,
   'حفظ',o=>{put('partners',{...p,id:p.id||uid(),name:o.name.trim(),phone:o.phone,capital:+o.capital||0,rate:+o.rate||0,companyPct:+o.companyPct||0})});
}
function customerForm(c){
  c=c||{};
  if(!S.partners.length){modal('<h2>تنبيه</h2><p>أضف شريك الأول.</p><button class="btn" onclick="closeModal()">حسناً</button>');return}
  formModal(c.id?'تعديل عميل':'عميل جديد',
   `<div class="fld"><label>الشريك صاحب العميل</label><select name="partnerId" required>${S.partners.map(p=>`<option value="${p.id}" ${(c.partnerId||st.pf)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></div>`+
   F('اسم العميل','name',c.name,'text','required')+F('الرقم القومي','nid',c.nid,'text','inputmode="numeric" maxlength="14"')+
   `<div class="two">${F('التليفون','phone',c.phone,'tel')}${F('تليفون آخر','phone2',c.phone2,'tel')}</div>`+F('العنوان','address',c.address)+F('الوظيفة','job',c.job),
   'حفظ',o=>{put('customers',{...c,...o,id:c.id||uid(),name:o.name.trim()})});
}
function contractForm(cid){
  if(!S.customers.length){modal('<h2>تنبيه</h2><p>أضف عميل الأول.</p><button class="btn" onclick="closeModal()">حسناً</button>');return}
  const cs=visC().length?visC():S.customers;
  formModal('عقد تقسيط جديد',
   `<div class="fld"><label>العميل</label><select name="customerId" id="kc" required>${cs.map(c=>`<option value="${c.id}" ${cid===c.id?'selected':''}>${esc(c.name)} — ${esc(pName(c.partnerId))}</option>`).join('')}</select></div>`+
   F('السلعة','item','','text','required')+
   `<div class="two">${F('سعر السلعة','price','','number','id="kp" min="0" step="any" required')}${F('المقدم','down','0','number','id="kd" min="0" step="any"')}</div>`+
   `<div class="two">${F('نسبة الربح %','rate','','number','id="kr" min="0" step="any" required')}${F('عدد الأشهر','months','12','number','id="km" min="1" max="120" required')}</div>`+
   F('تاريخ العقد','start',today(),'date','required')+
   `<div class="prev" id="pv"></div>`+
   `<div class="two">${F('اسم الضامن','gName')}${F('تليفون الضامن','gPhone','','tel')}</div>`+F('ملاحظات','note'),
   'حفظ العقد',o=>{
     const c=cust(o.customerId);const r=calcContract(o.price,o.down,o.rate,o.months);
     if(r.financed<=0&&r.total<=0)return false;
     const no=String(S.contracts.length+1+1000);
     put('contracts',{id:uid(),no,customerId:c.id,partnerId:c.partnerId,item:o.item.trim(),price:+o.price,down:+o.down||0,rate:+o.rate,months:r.months,start:o.start,financed:r.financed,profit:r.profit,total:r.total,v:2,inst:buildInst(r.financed,r.months,o.start),pays:[],gName:o.gName,gPhone:o.gPhone,note:o.note,createdAt:new Date().toISOString()});
   },()=>{
     const upd=()=>{const r=calcContract($('#kp').value,$('#kd').value,$('#kr').value,$('#km').value);
       $('#pv').innerHTML=`<div><span>الربح</span><b>${fmt(r.profit)}</b></div><div><span>إجمالي العقد بعد الربح</span><b>${fmt(r.total)}</b></div><div><span>المقدم</span><b>- ${fmt($('#kd').value)}</b></div><div><span>المتبقي للتقسيط</span><b>${fmt(r.financed)}</b></div><div><span>القسط الشهري</span><b>${fmt(r.per)}</b></div>`};
     const setRate=()=>{const c=cust($('#kc').value);const p=S.partners.find(x=>x.id===c.partnerId);if(p)$('#kr').value=p.rate||0;upd()};
     ['kp','kd','kr','km'].forEach(i=>$('#'+i).oninput=upd);$('#kc').onchange=setRate;setRate();
   });
}
function payForm(kid,idx){
  const k=S.contracts.find(x=>x.id===kid);if(!k)return;
  const def=idx!=null?k.inst[idx].amount-k.inst[idx].paid:(kLateAmt(k)||Math.min(kRemain(k),(k.inst.find(i=>i.paid<i.amount)||{amount:0}).amount));
  formModal('تسجيل دفعة — '+esc(cust(k.customerId).name),
   `<p class="mut">المتبقي على العقد: <b>${fmt(kRemain(k))}</b>${idx==null?' · الدفعة بتتوزع على أقدم الأقساط أولاً':''}</p>`+
   F('المبلغ المدفوع','amount',Math.round(def),'number','min="1" step="any" required')+F('تاريخ الدفع','date',today(),'date','required'),
   'تأكيد الدفع',o=>{
     const amt=Math.min(+o.amount,kRemain(k));const kk=JSON.parse(JSON.stringify(k));
     const used=applyPayment(kk,amt,o.date,idx);if(used<=0)return false;put('contracts',kk);
   });
}

function movForm(col,partnerId,rec){
  const isExp=col==='expenses';const r=rec||{};
  const title=r.id?(isExp?'تعديل مصروف':'تعديل سحب'):(isExp?'إضافة مصروف':'إضافة سحب');
  formModal(title,
   F('المبلغ (جنيه)','amount',r.amount??'','number','min="0.01" step="any" required')+
   F('التاريخ','date',r.date||today(),'date','required')+
   F('ملاحظة','note',r.note||'','text'),
   'حفظ',o=>{
     const amt=+o.amount;if(!(amt>0))return false;
     put(col,{id:r.id||uid(),partnerId:r.partnerId||partnerId,amount:amt,date:o.date||today(),note:(o.note||'').trim()});
   });
}

/* ---------- الأحداث ---------- */
document.addEventListener('click',e=>{
  if(e.target===$('#modal')){closeModal();return}
  const t=e.target.closest('[data-go],[data-open],[data-cust],[data-part],[data-act],[data-pay],[data-payi],[data-delk],[data-delc],[data-delp],[data-editc],[data-editp],[data-pf],[data-remnum],[data-addmov],[data-editmov],[data-delmov],[data-linknum],[data-copytg],[data-tglate]');if(!t)return;
  const d=t.dataset;
  if(d.go)go(d.go);
  else if(d.open)go('contracts',d.open);
  else if(d.cust)go('customers',d.cust);
  else if(d.part)go('partners',d.part);
  else if(d.act==='numbers')numbersModal();
  else if(d.act==='tgSettings')tgSettingsModal();
  else if(d.act==='tgWeek')sendWeekTg();
  else if(d.act==='tgAllLate')sendAllLateTg();
  else if(d.act==='tgSyncCust')syncCustomersTg();
  else if(d.linknum!=null)linkNumberTgModal(+d.linknum);
  else if(d.copytg)copyText(d.copytg,t);
  else if(d.tglate)sendLateOneTg(d.tglate);
  else if(d.remnum!=null){const n=remNumbers().filter((_,i)=>i!==+d.remnum);put('settings',{id:'main',numbers:n});numbersModal()}
  else if(d.addmov){const[col,pid]=d.addmov.split(':');movForm(col,pid)}
  else if(d.editmov){const[col,id]=d.editmov.split(':');const rec=(S[col]||[]).find(x=>x.id===id);if(rec)movForm(col,rec.partnerId,rec)}
  else if(d.delmov){const[col,id]=d.delmov.split(':');const lbl=col==='expenses'?'المصروف':'السحب';confirmModal(`حذف هذا ${lbl}؟`,()=>del(col,id))}
  else if(d.act==='newPartner')partnerForm();
  else if(d.act==='newCustomer')customerForm();
  else if(d.act==='newContract')contractForm(d.cid);
  else if(d.pay)payForm(d.pay);
  else if(d.payi){const[a,b]=d.payi.split(':');payForm(a,+b)}
  else if(d.delk)confirmModal('حذف العقد وكل أقساطه؟ لا يمكن التراجع.',()=>{del('contracts',d.delk);go('contracts')});
  else if(d.delc){if(S.contracts.some(k=>k.customerId===d.delc))modal('<h2>تنبيه</h2><p>العميل عليه عقود. احذف العقود الأول.</p><button class="btn" onclick="closeModal()">حسناً</button>');else confirmModal('حذف العميل؟',()=>{del('customers',d.delc);go('customers')})}
  else if(d.delp){if(S.customers.some(c=>c.partnerId===d.delp))modal('<h2>تنبيه</h2><p>الشريك عنده عملاء. انقلهم أو احذفهم الأول.</p><button class="btn" onclick="closeModal()">حسناً</button>');else if(S.expenses.some(x=>x.partnerId===d.delp)||S.withdrawals.some(x=>x.partnerId===d.delp))modal('<h2>تنبيه</h2><p>الشريك عليه مصروفات أو سحوبات. احذفها الأول.</p><button class="btn" onclick="closeModal()">حسناً</button>');else confirmModal('حذف الشريك؟',()=>{del('partners',d.delp);go('partners')})}
  else if(d.editc)customerForm(S.customers.find(c=>c.id===d.editc));
  else if(d.editp)partnerForm(S.partners.find(p=>p.id===d.editp));
  else if(d.pf){st.pf=d.pf;go('home')}
});
document.addEventListener('input',e=>{if(e.target.id==='q'){st.q=e.target.value;render()}});
$('#pfsel').addEventListener('change',e=>{st.pf=e.target.value;st.sel=null;render()});
const triggerSync=()=>{if(!cloudExpected()&&!hasCloudEnv())return;if(!DB)connectCloud();else flushQueue()};
$('#mode').addEventListener('click',triggerSync);
$('#mode').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();triggerSync()}});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.protocol==='http:')){
  window.addEventListener('load',()=>{navigator.serviceWorker.register('./sw.js').catch(()=>{})});
}
initStore();
</script>
</body>
